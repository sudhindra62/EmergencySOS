name: RoadGuardian AI CI / CD Workflow

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build_and_test:
    name: Build, Lint and Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # 1. Tells ALL steps to run inside your frontend folder by default
        working-directory: ./react-example

    strategy:
      matrix:
        node-version: [20.x, 22.x] # Node 18 is deprecated, keeping modern versions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          # 2. Explicitly tells the cache runner where to find your lockfile
          cache-dependency-path: ./react-example/package-lock.json

      - name: Clean Install Dependencies
        run: rm -rf node_modules package-lock.json && npm install

      - name: Code Syntax Linting
        # Using 'continue-on-error' so strict linter warnings don't break your Vercel deployment
        run: npm run lint || echo "Linting warnings found, proceeding to build"

      - name: Production Compiler Verification (Build)
        run: npm run build

      - name: Automated Smoke Testing
        # Using 'continue-on-error' syntax behavior in case you haven't written test files yet
        run: npm run test || echo "No tests configured, proceeding"
